services:
  # Two Redis shards. Names match the "redis-{shard}" host mask used in tests,
  # so RedisArray connects to redis-0 and redis-1.
  redis-0:
    image: redis:7-alpine

  redis-1:
    image: redis:7-alpine

  tests:
    build: .
    platform: linux/amd64
    depends_on:
      - redis-0
      - redis-1
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "composer install --no-interaction --no-progress && vendor/bin/phpunit"
